// Контракт відгуків для внутрішніх сервісів (Aggregator). Лише читання.
syntax = "proto3";

option csharp_namespace = "Reviews.Grpc";

package cinema.reviews.v1;

import "google/protobuf/timestamp.proto";

service ReviewsService {
  // Зведений рейтинг фільму. NOT_FOUND, якщо відгуків ще немає.
  rpc GetMovieRating (GetMovieRatingRequest) returns (MovieRatingReply);
  // Останні відгуки фільму (новіші першими). take: 1–20.
  rpc GetLatestReviews (GetLatestReviewsRequest) returns (ReviewsReply);
}

message GetMovieRatingRequest {
  int64 movie_id = 1;
}

message GetLatestReviewsRequest {
  int64 movie_id = 1;
  int32 take = 2;
}

message MovieRatingReply {
  int64 movie_id = 1;
  string movie_title = 2;
  double average = 3;
  int32 count = 4;
  map<int32, int32> distribution = 5;         // оцінка (1–5) -> кількість
}

message ReviewReply {
  string id = 1;                              // ObjectId як рядок
  string type = 2;                            // viewer | critic | quick
  string author_name = 3;
  int32 rating = 4;
  string text = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ReviewsReply {
  repeated ReviewReply reviews = 1;
  int64 total_count = 2;
}
